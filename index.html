<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<title>C 语言刷题 · 翁恺课程</title>
<style>
/* =========================================================
 * 样式：手机竖屏优先，最大宽度 520px，无动画
 * ========================================================= */
:root{
  --bg:#f4f6f9; --card:#ffffff; --line:#e3e8ef; --text:#1f2733; --muted:#6b7688;
  --primary:#2563a8; --primary-soft:#eaf2fc;
  --ok:#17794a; --ok-bg:#e9f7ef; --bad:#c0392b; --bad-bg:#fdeceb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
.hidden{display:none !important}

/* 顶栏 */
.topbar{padding:18px 16px 12px;text-align:center}
.topbar .title{font-size:20px;font-weight:700;letter-spacing:.5px}
.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:4px}

.wrap{max-width:520px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;color:var(--text)}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.center{text-align:center}

/* 通用按钮 */
.btn{
  display:block;width:100%;min-height:50px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);
  font-size:16px;font-family:inherit;font-weight:600;text-align:center;cursor:pointer;
}
.btn:active{opacity:.75}
.btn:disabled{background:#eef1f5;color:#9aa4b2;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-large{min-height:54px;font-size:17px;margin-bottom:12px}
.btn-ghost{font-size:14px;font-weight:500;min-height:46px}
.btn-ghost.danger{color:var(--bad)}
.btn-back{min-height:40px;width:auto;padding:6px 14px;font-size:14px;font-weight:500}

.grid{display:grid;gap:8px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}

/* 范围 / 模式选择 */
.choice{min-height:60px;padding:8px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.choice .main{font-size:15px;font-weight:700}
.choice .sub{font-size:11px;color:var(--muted);font-weight:400;line-height:1.3}
.choice.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.choice.on .sub{color:var(--primary)}
.mode{min-height:60px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:15px}
.mode .sub{font-size:11px;color:var(--muted);font-weight:400}
.mode.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.mode.on .sub{color:var(--primary)}

/* 统计 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.stat .num{font-size:22px;font-weight:700;line-height:1.2}
.stat .label{font-size:11px;color:var(--muted);margin-top:2px}
.progress{height:8px;background:#e9eef4;border-radius:99px;overflow:hidden;margin-top:12px}
.progress-bar{height:100%;width:0;background:var(--primary);border-radius:99px}

/* 答题页 */
.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.quiz-progress{font-size:14px;color:var(--muted);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:#eef2f7;color:var(--muted)}
.tag-type{background:#fdf0e3;color:#a05a12}
/* 题干：保留代码换行，ASCII 用等宽、中文用系统字体 */
.q-text{
  white-space:pre-wrap;word-break:break-word;
  font-family:Consolas,"SF Mono",Menlo,"PingFang SC","Microsoft YaHei",monospace;
  font-size:14.5px;line-height:1.65;
  background:#f7f9fc;border-left:3px solid #cbd7e6;border-radius:6px;
  padding:12px;margin-bottom:14px;
}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;width:100%;min-height:52px;
  padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font-family:inherit;font-size:15px;color:var(--text);text-align:left;cursor:pointer;
  word-break:break-word;
}
.opt-letter{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:6px;background:#eef2f7;color:var(--muted);font-weight:700;font-size:13px}
.opt-text{flex:1;line-height:1.6}
.opt.selected{border-color:var(--primary);background:var(--primary-soft)}
.opt.selected .opt-letter{background:var(--primary);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .opt-letter{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .opt-letter{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}

/* 提交后的反馈 */
.feedback{border-radius:10px;padding:12px;margin-bottom:14px;font-size:14px;line-height:1.7}
.feedback.ok{background:var(--ok-bg);border:1px solid #bfe4cd;color:var(--ok)}
.feedback.bad{background:var(--bad-bg);border:1px solid #f3c4bf;color:var(--bad)}
.fb-title{font-size:16px;font-weight:700;margin-bottom:4px}
.fb-exp{color:var(--text);margin-top:6px}
.fb-note{font-size:12px;margin-top:6px;opacity:.85}

/* 完成页 */
.finish-title{font-size:20px;font-weight:700;text-align:center;margin:8px 0 12px}
.finish-line{text-align:center;font-size:15px;margin:6px 0}

/* 轻提示 */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  max-width:86%;padding:10px 16px;border-radius:8px;background:#2b3440;color:#fff;
  font-size:14px;text-align:center;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.15)
}

/* 周小节选择 */
.unit{min-height:58px;padding:8px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:14px}
.unit .main{font-weight:700}
.unit .sub{font-size:11px;color:var(--muted);font-weight:400;line-height:1.3;text-align:center}
.unit.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.unit.on .sub{color:var(--primary)}

/* 写代码练习：编辑器、参考实现、检查点 */
.code-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.code-tools .btn{min-height:42px;font-size:13px}
.code-editor{
  display:block;width:100%;min-height:230px;padding:12px;margin-bottom:14px;
  border:1px solid var(--line);border-radius:10px;background:#fbfcfe;color:var(--text);
  font-family:Consolas,"SF Mono",Menlo,"PingFang SC","Microsoft YaHei",monospace;
  font-size:14px;line-height:1.6;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto;
}
.code-block{
  white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:10px;margin:10px 0;max-height:300px;overflow:auto;
  font-family:Consolas,"SF Mono",Menlo,"PingFang SC","Microsoft YaHei",monospace;
  font-size:13px;line-height:1.6;color:var(--text);
}
.check-list{margin:8px 0;font-size:13px;line-height:1.9}
.check-list .hit{color:var(--ok)}
.check-list .miss{color:var(--bad)}
.feedback.info{background:#f2f6fb;border:1px solid #d6e0ec;color:var(--text)}
.self-judge{margin-bottom:14px}
.self-judge .hint{margin:0 0 8px}
</style>
</head>
<body>

<header class="topbar">
  <div class="title">C 语言刷题</div>
  <div class="subtitle">翁恺《程序设计入门——C语言》 · 4 阶段 / 14 小节 · 108 题</div>
</header>

<main class="wrap">

  <!-- ================= 首页 ================= -->
  <section id="view-home">
    <div class="card">
      <h2>1 · 选择阶段</h2>
      <div id="stage-list" class="grid grid-3"></div>
      <p id="stage-desc" class="hint"></p>
    </div>

    <div class="card">
      <h2>2 · 选择周小节</h2>
      <div id="unit-list" class="grid grid-2"></div>
      <p id="unit-desc" class="hint"></p>
    </div>

    <div class="card">
      <h2>3 · 选择模式</h2>
      <div id="mode-list" class="grid grid-3"></div>
    </div>

    <button id="btn-start" class="btn btn-primary btn-large" type="button">开始刷题</button>

    <div class="card">
      <h2>当前范围 / 模式统计</h2>
      <div class="stats">
        <div class="stat"><div id="st-done" class="num">0</div><div class="label">已刷题数</div></div>
        <div class="stat"><div id="st-rate" class="num">0%</div><div class="label">正确率</div></div>
        <div class="stat"><div id="st-wrong" class="num">0</div><div class="label">错题数</div></div>
      </div>
      <div class="progress"><div id="st-bar" class="progress-bar"></div></div>
      <p id="stats-note" class="hint"></p>
    </div>

    <div class="card">
      <h2>数据管理</h2>
      <div class="grid grid-2">
        <button id="btn-clear-wrong" class="btn btn-ghost" type="button">清空错题本</button>
        <button id="btn-clear-all" class="btn btn-ghost danger" type="button">重置全部数据</button>
      </div>
      <p class="hint">错题、进度、正确率只存在本机浏览器的 localStorage 中，不联网、不上传；换设备或清除浏览器数据会丢失。</p>
    </div>
  </section>

  <!-- ================= 答题页 ================= -->
  <section id="view-quiz" class="hidden">
    <div class="quiz-head">
      <button id="btn-back" class="btn btn-back" type="button">‹ 返回首页</button>
      <span id="quiz-progress" class="quiz-progress"></span>
    </div>

    <div class="card">
      <!-- 题目区域 -->
      <div id="quiz-body">
        <div class="tags">
          <span id="q-tag-stage" class="tag"></span>
          <span id="q-tag-unit" class="tag"></span>
          <span id="q-tag-topic" class="tag"></span>
          <span id="q-tag-type" class="tag tag-type"></span>
        </div>
        <div id="q-text" class="q-text"></div>

        <!-- 选择题区域 -->
        <div id="q-options" class="options"></div>

        <!-- 编程题区域：手写代码编辑器 -->
        <div id="code-area" class="hidden">
          <div class="code-tools">
            <button id="btn-fill-starter" class="btn btn-ghost" type="button">填入起手代码</button>
            <button id="btn-clear-code" class="btn btn-ghost" type="button">清空编辑器</button>
          </div>
          <textarea id="code-editor" class="code-editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="在这里写 C 代码…"></textarea>
        </div>

        <div id="q-feedback" class="feedback hidden"></div>

        <!-- 编程题自评：浏览器不能编译 C，对照参考实现后由本人确认 -->
        <div id="self-judge" class="self-judge hidden">
          <p class="hint">浏览器不能编译 C，请对照参考实现自查后再记分：</p>
          <div class="grid grid-2">
            <button id="judge-ok" class="btn btn-primary" type="button">✓ 我写对了</button>
            <button id="judge-no" class="btn btn-ghost" type="button">✗ 加入错题本</button>
          </div>
        </div>

        <button id="btn-submit" class="btn btn-primary btn-large" type="button">提交答案</button>
        <button id="btn-next" class="btn btn-primary btn-large hidden" type="button">下一题</button>
      </div>
      <!-- 本轮完成区域 -->
      <div id="finish-panel" class="hidden"></div>
    </div>
    <p id="round-stats" class="hint center"></p>
  </section>

</main>

<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================================
 * 一、题库（QUESTION_BANK）
 * ---------------------------------------------------------------------
 * 以后加题：照抄一个对象，改 id（保持唯一）即可，其余字段说明：
 *   id          : 数字，唯一
 *   stage       : 1~4，对应翁恺课程四个阶段
 *   unit        : "1.1" ~ "4.4"，14 个周小节之一（见后面的 UNITS 常量）
 *   topic       : 知识点标签，随便写
 *   type        : "单选" / "代码输出" / "编程题"
 *   question    : 题干；用反引号模板字符串可直接换行写代码
 *   ---- 选择题（单选 / 代码输出）----
 *   options     : 恰好 4 个字符串，对应 A/B/C/D
 *   answer      : 正确选项字母 "A"/"B"/"C"/"D"
 *   ---- 编程题（type = "编程题"）----
 *   starter     : 起手代码，进入题目时预填进编辑器
 *   reference   : 参考实现，提交后展示给用户对照
 *   checks      : 关键检查点数组；元素可为字符串或字符串数组（数组内任一命中即可）
 *   explanation : 简短解析，尽量点一个常见坑
 * 注意：题干里若出现 C 的 '\0'，在 JS 字符串里要写成 '\\0'。
 * ========================================================================= */
const QUESTION_BANK = [

/* ---------------- 阶段一：第1–3周 程序结构 / 变量与表达式 / 分支结构 ---------------- */
{
  id: 1, stage: 1, unit: "1.1", topic: "程序结构", type: "单选",
  question: `一个可以运行的 C 程序，必须包含且只能包含一个什么？`,
  options: ["main 函数", "printf 函数", "自定义函数", "#include <stdio.h>"],
  answer: "A",
  explanation: "main 是程序入口且必须唯一；头文件和其它函数都可以没有。坑：写成 mian 或 Main 链接时会找不到入口。"
},
{
  id: 2, stage: 1, unit: "1.1", topic: "程序结构", type: "代码输出",
  question: `int a = 65;
printf("%c, %d", a, a);
输出是什么？`,
  options: ["65, 65", "A, A", "A, 65", "65, A"],
  answer: "C",
  explanation: "%c 按字符输出 65 对应的 'A'，%d 按整数输出 65。坑：格式符必须和变量类型对应，printf 参数前不要加 &。"
},
{
  id: 3, stage: 1, unit: "1.2", topic: "变量与表达式", type: "代码输出",
  question: `int a = 7, b = 2;
printf("%d %d", a / b, a % b);
输出是什么？`,
  options: ["3 3", "3 1", "3.5 1", "3 0"],
  answer: "B",
  explanation: "两个 int 相除结果仍是 int，7/2 截断得 3；7%2 得余数 1。坑：不是 3.5，想算小数要写 7.0/2。"
},
{
  id: 4, stage: 1, unit: "1.2", topic: "变量与表达式", type: "代码输出",
  question: `int x = -7;
printf("%d %d", x / 2, x % 2);
（按 C99 / gcc）输出是什么？`,
  options: ["-4 1", "-3 1", "-4 -1", "-3 -1"],
  answer: "D",
  explanation: "C99 起整数除法向 0 取整，-7/2 = -3；余数符号跟被除数，-7%2 = -1。坑：判断奇偶别只写 x%2==1，负数会漏。"
},
{
  id: 5, stage: 1, unit: "1.2", topic: "变量与表达式", type: "单选",
  question: `以下哪个是合法的 C 变量名？`,
  options: ["2sum", "_total_1", "int", "a-b"],
  answer: "B",
  explanation: "标识符只能由字母、数字、下划线组成且不能以数字开头；int 是关键字，'-' 是减号不能出现在名字里。"
},
{
  id: 6, stage: 1, unit: "1.2", topic: "变量与表达式", type: "代码输出",
  question: `int a = 5;
int b = a++;
printf("%d %d", a, b);
输出是什么？`,
  options: ["6 6", "5 5", "5 6", "6 5"],
  answer: "D",
  explanation: "a++ 先把旧值 5 交给 b，再自增；++a 才是先加后用。坑：别在同一个表达式里多次改写同一个变量。"
},
{
  id: 7, stage: 1, unit: "1.2", topic: "变量与表达式", type: "单选",
  question: `表达式 10 / 4 * 4 + 10 % 4 的值是？`,
  options: ["10", "8", "12", "2"],
  answer: "A",
  explanation: "/、*、% 同级左结合：10/4=2 → 2*4=8 → 10%4=2 → 10。坑：整数除法先截断了，别按数学算式算成 10+2。"
},
{
  id: 8, stage: 1, unit: "1.2", topic: "变量与表达式", type: "代码输出",
  question: `double a = 1.0 / 2;
printf("%.1f", a);
输出是什么？`,
  options: ["0", "0.0", "0.5", "1.0"],
  answer: "C",
  explanation: "只要有一个操作数是浮点数就做浮点除法；写成 1/2 会得 0。坑：printf 里输出 double 用 %f（%.1f），不是 %d。"
},
{
  id: 9, stage: 1, unit: "1.1", topic: "变量与表达式", type: "单选",
  question: `把用户输入的整数读入 int 变量 n，正确的写法是？`,
  options: ['scanf("%d", n);', 'scanf("%f", &n);', 'scanf("%d", &n);', 'scanf("%d", *n);'],
  answer: "C",
  explanation: "scanf 需要变量地址 &n，%d 对应 int；%f 是给 float 用的。坑：格式串里多写空格、逗号都会导致输入不匹配。"
},
{
  id: 10, stage: 1, unit: "1.3", topic: "分支结构", type: "代码输出",
  question: `int a = 0, b = 1, c = 2;
if (a)
    if (b) c = 3;
else c = 4;
printf("%d", c);
输出是什么？`,
  options: ["2", "3", "4", "0"],
  answer: "A",
  explanation: "else 总和最近的未配对 if 结合，缩进不算数；这里 a=0 外层为假，内层 if-else 整段被跳过，c 仍是 2。建议一律加花括号。"
},
{
  id: 11, stage: 1, unit: "1.3", topic: "分支结构", type: "代码输出",
  question: `int x = 2;
switch (x) {
    case 1: printf("A");
    case 2: printf("B");
    case 3: printf("C"); break;
    default: printf("D");
}
输出是什么？`,
  options: ["B", "BCD", "ABC", "BC"],
  answer: "D",
  explanation: "case 只是入口，没有 break 会一路穿透：命中 case 2 后继续输出 C 才停，default 不执行。坑：switch 的条件只能是整型表达式。"
},
{
  id: 12, stage: 1, unit: "1.3", topic: "分支结构", type: "单选",
  question: `表示「x 在 [1, 10] 区间内」的正确 C 表达式是？`,
  options: ["1 <= x <= 10", "x >= 1 && x <= 10", "x >= 1 || x <= 10", "x > 1 & x < 10"],
  answer: "B",
  explanation: "数学连写不等式会变成 (1<=x)<=10，结果恒为真；要用 && 连接。坑：别把逻辑与 && 写成位与 &。"
},
{
  id: 13, stage: 1, unit: "1.3", topic: "分支结构", type: "代码输出",
  question: `int a = 0, b = 0;
if (a++ && b++) ;
printf("%d %d", a, b);
输出是什么？`,
  options: ["1 1", "0 1", "0 0", "1 0"],
  answer: "D",
  explanation: "&& 左边 a++ 取到旧值 0 为假，短路后右边 b++ 根本不执行；a 仍自增为 1，b 保持 0。坑：&&、|| 都有短路特性。"
},
{
  id: 14, stage: 1, unit: "1.3", topic: "闰年判断", type: "单选",
  question: `闰年条件「能被 4 整除且不能被 100 整除，或能被 400 整除」应写成？`,
  options: [
    "y % 4 == 0 || y % 400 == 0",
    "(y % 4 == 0 && y % 100 != 0) || y % 400 == 0",
    "(y % 4 == 0 || y % 100 != 0) && y % 400 == 0",
    "y % 4 == 0 && y % 100 == 0 || y % 400 == 0"
  ],
  answer: "B",
  explanation: "1900 能被 4 整除但被 100 整除，不是闰年；2000 能被 400 整除才是。坑：百年不闰、四百年再闰，别只判 y%4。"
},
{

  { key: "all", name: "全部",   short: "108 题",   desc: "四个阶段全部题目" }
];

/* 14 个周小节（二级范围）：阶段 → 周 → 知识点，严格对齐 1–14 周大纲 */
const UNITS = [
  { key: "1.1", stage: "1", week: "第1周",  name: "程序结构与输入输出" },
  { key: "1.2", stage: "1", week: "第2周",  name: "变量与表达式" },
  { key: "1.3", stage: "1", week: "第3周",  name: "分支结构" },
  { key: "2.1", stage: "2", week: "第4周",  name: "循环基础" },
  { key: "2.2", stage: "2", week: "第5周",  name: "循环控制与嵌套" },
  { key: "2.3", stage: "2", week: "第6周",  name: "数据类型" },
  { key: "2.4", stage: "2", week: "第7周",  name: "函数" },
  { key: "3.1", stage: "3", week: "第8周",  name: "数组" },
  { key: "3.2", stage: "3", week: "第9周",  name: "指针" },
  { key: "3.3", stage: "3", week: "第10周", name: "字符串" },
  { key: "4.1", stage: "4", week: "第11周", name: "结构类型" },
  { key: "4.2", stage: "4", week: "第12周", name: "程序结构" },

  { key: "4.4", stage: "4", week: "第14周", name: "文件" }
];

/* 三种模式：选择题随机、手写代码练习、错题重练（可混合两种题型） */
const MODES = [
  { key: "random", name: "随机刷题",   sub: "选择题随机抽" },
  { key: "coding", name: "写代码练习", sub: "手写代码对照参考" },
  { key: "wrong",  name: "错题重练",   sub: "只练错题做对移出" }
];

/* 题目 id → 题目对象，方便按队列取题 */
const BY_ID = {};
QUESTION_BANK.forEach(function (q) { BY_ID[q.id] = q; });

function freshState() {
  return { version: 1, seen: {}, wrong: {}, answered: 0, correct: 0,
           lastStage: "all", lastUnit: "all", lastMode: "random" };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return freshState();
    const data = JSON.parse(raw);
    // 兼容旧版数据（没有 lastUnit 时回落到 "all"），避免页面报错
    const base = freshState();
    return {
      version: 1,
      seen:     data.seen     || {},
      wrong:    data.wrong    || {},
      answered: data.answered || 0,
      correct:  data.correct  || 0,
      lastStage: data.lastStage || base.lastStage,
      lastUnit:  data.lastUnit  || base.lastUnit,
      lastMode:  data.lastMode  || base.lastMode
    };
  } catch (e) {
    return freshState(); // 数据损坏或 localStorage 被禁用时回退到空状态
  }
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    toast("本地存储不可用，本次进度可能无法保存");
  }
}

/* =========================================================================
 * 三、通用工具与统计
 * ========================================================================= */
const $ = function (id) { return document.getElementById(id); };
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.add("hidden"); }, 2200);
}

/* 模式决定参与的题目类型，保证「已刷 x/total」与一轮实际题量一致 */
function modeTypes(mode) {
  if (mode === "random") return ["单选", "代码输出"];
  if (mode === "coding") return ["编程题"];
  return null; // 错题重练：两种题型都可能出现
}

/* 按「阶段 + 周小节 + 模式」取题；stage/unit 为 "all" 时不过滤 */
function poolOf(stageKey, unitKey, mode) {
  const types = modeTypes(mode || "random");
  return QUESTION_BANK.filter(function (q) {
    if (stageKey !== "all" && String(q.stage) !== stageKey) return false;
    if (unitKey && unitKey !== "all" && q.unit !== unitKey) return false;
    if (types && types.indexOf(q.type) < 0) return false;
    return true;
  });
}

/* 当前范围/模式的统计：已刷（去重）、正确率（按累计作答次数）、错题数 */
function statsOf(stageKey, unitKey, mode) {
  const pool = poolOf(stageKey, unitKey, mode);
  let done = 0, times = 0, right = 0, wrong = 0;
  pool.forEach(function (q) {
    const rec = state.seen[q.id];
    if (rec) { done++; times += rec.t || 0; right += rec.c || 0; }
    if (state.wrong[q.id]) wrong++;
  });
  return {
    done: done, total: pool.length, wrong: wrong, times: times, right: right,
    rate: times ? Math.round(right / times * 100) : 0
  };
}

/* 代码自查：去掉注释和所有空白，让缩进 / 换行差异不影响检查点比对 */
function normalizeCode(s) {
  return s.replace(/\/\*[\s\S]*?\*\//g, "")
          .replace(/\/\/[^\n]*/g, "")
          .replace(/\s+/g, "");
}

/* 返回每个检查点是否命中；检查点可以是字符串，或"任一命中即可"的字符串数组 */
function checkCode(code, checks) {
  const src = normalizeCode(code);
  return checks.map(function (c) {
    const hit = Array.isArray(c)
      ? c.some(function (x) { return src.indexOf(normalizeCode(x)) >= 0; })
      : src.indexOf(normalizeCode(c)) >= 0;
    return { label: Array.isArray(c) ? c.join(" 或 ") : c, hit: hit };
  });
}

function unitName(key) {
  const u = UNITS.find(function (x) { return x.key === key; });
  return u ? u.week + " · " + u.name : "全部小节";
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function showView(name) {
  $("view-home").classList.toggle("hidden", name !== "home");
  $("view-quiz").classList.toggle("hidden", name !== "quiz");
  window.scrollTo(0, 0);
}

function stageName(key) {
  const s = STAGES.find(function (x) { return x.key === key; });
  return s ? s.name : "全部";
}

/* =========================================================================
 * 四、首页渲染
 * ========================================================================= */
function renderHome() {
  // 若记录的小节不属于当前阶段，自动回到「全部小节」
  if (state.lastUnit !== "all") {
    const u = UNITS.find(function (x) { return x.key === state.lastUnit; });
    if (!u || state.lastStage === "all" || u.stage !== state.lastStage) state.lastUnit = "all";
  }

  // 阶段按钮
  const stageBox = $("stage-list");
  stageBox.innerHTML = STAGES.map(function (s) {
    const on = s.key === state.lastStage ? " on" : "";
    return '<button type="button" class="btn choice' + on + '" data-stage="' + s.key + '">' +
             '<span class="main">' + s.name + '</span><span class="sub">' + s.short + '</span>' +
           '</button>';
  }).join("");

  // 周小节按钮：选定阶段后列出该阶段的 3~4 个小节 + 「全部小节」
  const unitBox = $("unit-list");
  let units;
  if (state.lastStage === "all") {
    units = [{ key: "all", week: "共 14 周", name: "全部小节" }];
  } else {
    units = [{ key: "all", week: "本阶段", name: "全部小节" }].concat(
      UNITS.filter(function (u) { return u.stage === state.lastStage; })
    );
  }
  unitBox.innerHTML = units.map(function (u) {
    const on = u.key === state.lastUnit ? " on" : "";
    return '<button type="button" class="btn unit' + on + '" data-unit="' + u.key + '">' +
             '<span class="main">' + u.name + '</span>' +
             '<span class="sub">' + (u.key === "all" ? u.week : u.week + " · " + u.key) + '</span>' +
           '</button>';
  }).join("");
  $("unit-desc").textContent = state.lastStage === "all"
    ? "已选全部 4 个阶段 / 14 个周小节；想按周练，请先选一个具体阶段。"
    : unitName(state.lastUnit) + "（选择题 + 编程题）";

  // 模式按钮
  const modeBox = $("mode-list");
  modeBox.innerHTML = MODES.map(function (m) {
    const on = m.key === state.lastMode ? " on" : "";
    return '<button type="button" class="btn mode' + on + '" data-mode="' + m.key + '">' +
             '<span>' + m.name + '</span><span class="sub">' + m.sub + '</span>' +
           '</button>';
  }).join("");

  // 阶段说明
  const cur = STAGES.find(function (s) { return s.key === state.lastStage; }) || STAGES[4];
  $("stage-desc").textContent = cur.name + " · " + cur.short + "：" + cur.desc;

  // 统计（按当前范围 + 当前模式的题量计算，进度条才与一轮题量一致）
  const st = statsOf(state.lastStage, state.lastUnit, state.lastMode);
  $("st-done").textContent  = st.done + "/" + st.total;
  $("st-rate").textContent  = st.rate + "%";
  $("st-wrong").textContent = st.wrong;
  $("st-bar").style.width   = (st.total ? st.done / st.total * 100 : 0) + "%";
  $("stats-note").textContent = "累计作答 " + st.times + " 次，答对 " + st.right +
    " 次；已刷题数按不重复题目计，正确率按作答次数计。编程题由自评记分。";

  // 开始按钮
  const btn = $("btn-start");
  if (state.lastMode === "wrong") {
    btn.textContent = st.wrong ? "开始错题重练（" + st.wrong + " 题）" : "错题本是空的";
    btn.disabled = st.wrong === 0;
  } else if (state.lastMode === "coding") {
    btn.textContent = st.total ? "开始写代码练习（" + st.total + " 题）" : "本范围暂无编程题";
    btn.disabled = st.total === 0;
  } else {
    btn.textContent = "开始刷题（" + st.total + " 题）";
    btn.disabled = st.total === 0;
  }
}

/* 首页交互：事件委托 */
$("stage-list").addEventListener("click", function (e) {
  const b = e.target.closest("[data-stage]");
  if (!b) return;
  state.lastStage = b.dataset.stage;
  state.lastUnit = "all"; // 换阶段时重置小节，避免出现不属于该阶段的组合
  saveState();
  renderHome();
});
$("unit-list").addEventListener("click", function (e) {
  const b = e.target.closest("[data-unit]");
  if (!b) return;
  state.lastUnit = b.dataset.unit;
  saveState();
  renderHome();
});
$("mode-list").addEventListener("click", function (e) {
  const b = e.target.closest("[data-mode]");
  if (!b) return;
  state.lastMode = b.dataset.mode;
  saveState();
  renderHome();
});

/* =========================================================================
 * 五、答题流程
 * ---------------------------------------------------------------------
 * session.queue 是本轮的题号队列（进入时打乱一次）
 * random：范围内的选择题；coding：范围内的编程题
 * wrong ：范围内的错题快照（两种题型混合），做对即从 state.wrong 移出
 * 选择题提交即判分；编程题先看检查点与参考实现，再由本人自评记分
 * ========================================================================= */
let session = null;

function startQuiz() {
  // 错题重练要能覆盖两种题型，所以按 "wrong" 的题型规则取候选
  const pool = poolOf(state.lastStage, state.lastUnit, state.lastMode);
  let ids;
  if (state.lastMode === "wrong") {
    ids = pool.filter(function (q) { return !!state.wrong[q.id]; })
              .map(function (q) { return q.id; });
    if (!ids.length) { toast("当前范围没有错题，先去刷题吧"); return; }
  } else {
    ids = pool.map(function (q) { return q.id; });
    if (!ids.length) { toast("当前范围没有题目"); return; }
  }
  shuffle(ids);
  session = {
    stageKey: state.lastStage,
    unitKey: state.lastUnit,
    mode: state.lastMode,
    queue: ids,
    index: 0,
    selected: null,
    submitted: false,
    judged: false,
    roundAnswered: 0,
    roundCorrect: 0
  };
  showView("quiz");
  renderQuestion();
}

function renderQuestion() {
  if (session.index >= session.queue.length) { renderFinish(); return; }

  const q = BY_ID[session.queue[session.index]];
  const isCode = q.type === "编程题";
  session.selected = null;
  session.submitted = false;
  session.judged = false;

  $("quiz-body").classList.remove("hidden");
  $("finish-panel").classList.add("hidden");
  $("quiz-progress").textContent = "第 " + (session.index + 1) + " / " + session.queue.length + " 题";
  $("q-tag-stage").textContent = stageName(String(q.stage));
  $("q-tag-unit").textContent  = unitName(q.unit);
  $("q-tag-topic").textContent = q.topic;
  $("q-tag-type").textContent  = q.type;
  $("q-text").textContent      = q.question; // textContent 保证题库里的 < > 等符号安全显示

  $("q-feedback").classList.add("hidden");
  $("self-judge").classList.add("hidden");
  $("btn-submit").classList.remove("hidden");
  $("btn-submit").textContent = isCode ? "提交代码 / 看参考答案" : "提交答案";
  $("btn-next").classList.add("hidden");
  $("round-stats").textContent = "本轮已答 " + session.roundAnswered + " 题，答对 " + session.roundCorrect + " 题";

  // 编程题：显示代码编辑器，隐藏选择题选项
  $("q-options").classList.toggle("hidden", isCode);
  $("code-area").classList.toggle("hidden", !isCode);
  if (isCode) {
    $("q-options").innerHTML = "";
    $("code-editor").value = q.starter;
    $("code-editor").disabled = false;
    return;
  }

  // 选择题：构造 4 个选项按钮（字母固定，内容用 textContent 防注入）
  $("code-editor").value = "";
  const box = $("q-options");
  box.innerHTML = "";
  q.options.forEach(function (text, i) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt";
    btn.dataset.index = String(i);
    const letter = document.createElement("span");
    letter.className = "opt-letter";
    letter.textContent = LETTERS[i];
    const body = document.createElement("span");
    body.className = "opt-text";
    body.textContent = text;
    btn.appendChild(letter);
    btn.appendChild(body);
    btn.addEventListener("click", function () { selectOption(i); });
    box.appendChild(btn);
  });
}

function selectOption(i) {
  if (session.submitted) return;
  session.selected = i;
  const opts = $("q-options").children;
  for (let k = 0; k < opts.length; k++) opts[k].classList.toggle("selected", k === i);
}

function submitAnswer() {
  if (session.submitted) return;
  const q = BY_ID[session.queue[session.index]];

  // 编程题走「检查点 + 参考实现 + 自评」流程
  if (q.type === "编程题") { submitCode(q); return; }

  if (session.selected === null) { toast("请先选择一个答案"); return; }
  const isCorrect = LETTERS[session.selected] === q.answer;
  session.submitted = true;
  const removed = recordAnswer(q, isCorrect);

  // ① 选项着色：正确项标绿，误选项标红
  const opts = $("q-options").children;
  for (let k = 0; k < opts.length; k++) {
    opts[k].disabled = true;
    opts[k].classList.remove("selected");
    if (LETTERS[k] === q.answer) opts[k].classList.add("correct");
    else if (k === session.selected) opts[k].classList.add("wrong");
  }

  // ② 反馈：对错、正确答案、简短解析
  const fb = $("q-feedback");
  fb.className = "feedback " + (isCorrect ? "ok" : "bad");
  fb.innerHTML = '<div class="fb-title"></div><div class="fb-line"></div>' +
                 '<div class="fb-line"></div><div class="fb-exp"></div><div class="fb-note"></div>';
  const lines = fb.querySelectorAll(".fb-line");
  fb.querySelector(".fb-title").textContent = isCorrect ? "✓ 回答正确" : "✗ 回答错误";
  lines[0].textContent = "正确答案：" + q.answer + "（" + q.options[LETTERS.indexOf(q.answer)] + "）";
  lines[1].textContent = "你的答案：" + LETTERS[session.selected];
  fb.querySelector(".fb-exp").textContent = "解析：" + q.explanation;
  fb.querySelector(".fb-note").textContent = removed
    ? "✓ 该题已从错题本移除" : (isCorrect ? "" : "✗ 已加入错题本，可在「错题重练」中巩固");
  fb.classList.remove("hidden");

  showNextButton();
}

/* 统一记账：更新 seen / 全局累计 / 错题本，并立即持久化 */
function recordAnswer(q, isCorrect) {
  const rec = state.seen[q.id] || { t: 0, c: 0 };
  rec.t++;
  if (isCorrect) rec.c++;
  state.seen[q.id] = rec;
  state.answered++;
  if (isCorrect) state.correct++;

  let removed = false;
  if (isCorrect) {
    if (state.wrong[q.id]) { delete state.wrong[q.id]; removed = true; }
  } else {
    const w = state.wrong[q.id] || { n: 0, ts: 0 };
    w.n++;
    w.ts = Date.now();
    state.wrong[q.id] = w;
  }
  saveState(); // 立即持久化，刷新 / 关闭浏览器不丢

  session.roundAnswered++;
  if (isCorrect) session.roundCorrect++;
  $("round-stats").textContent = "本轮已答 " + session.roundAnswered + " 题，答对 " + session.roundCorrect + " 题";
  return removed;
}

function showNextButton() {
  $("btn-submit").classList.add("hidden");
  $("btn-next").classList.remove("hidden");
  $("btn-next").textContent = (session.index + 1 >= session.queue.length) ? "查看本轮结果" : "下一题";
}

/* 编程题：检查点自查 + 参考实现对照
 * 纯前端没有 C 编译器，检查点只是提示，不代替编译运行，最终由用户自评记分 */
function submitCode(q) {
  const editor = $("code-editor");
  const code = editor.value;
  if (normalizeCode(code).length < 20) { toast("先写点代码，或点「填入起手代码」开始"); return; }
  if (normalizeCode(code) === normalizeCode(q.starter)) { toast("还没动笔呢，先改改起手代码"); return; }
  session.submitted = true;
  editor.disabled = true;

  const results = checkCode(code, q.checks);
  const hits = results.filter(function (r) { return r.hit; }).length;
  const fb = $("q-feedback");
  fb.className = "feedback info";
  fb.innerHTML = '<div class="fb-title"></div><div class="fb-line"></div>' +
                 '<div class="check-list"></div><div class="fb-exp"></div>' +
                 '<div class="fb-note"></div><pre class="code-block"></pre>';
  fb.querySelector(".fb-title").textContent = "代码自查结果";
  fb.querySelector(".fb-line").textContent =
    "关键检查点命中 " + hits + " / " + results.length + " 个（仅作提示，不代表编译通过）";
  const list = fb.querySelector(".check-list");
  results.forEach(function (r) {
    const div = document.createElement("div");
    div.className = r.hit ? "hit" : "miss";
    div.textContent = (r.hit ? "✓ " : "✗ ") + r.label;
    list.appendChild(div);
  });
  fb.querySelector(".fb-exp").textContent = "解析：" + q.explanation;
  fb.querySelector(".fb-note").textContent = "参考实现见下方；建议在本地编译器跑一遍后自评。";
  fb.querySelector(".code-block").textContent = q.reference;
  fb.classList.remove("hidden");

  $("btn-submit").classList.add("hidden");
  $("self-judge").classList.remove("hidden");
}

/* 自评后才记账，保证正确率 / 错题本数据可信 */
function judgeSelf(ok) {
  if (!session.submitted || session.judged) return;
  const q = BY_ID[session.queue[session.index]];
  session.judged = true;
  const removed = recordAnswer(q, ok);
  const fb = $("q-feedback");
  fb.querySelector(".fb-title").textContent = ok ? "✓ 已记录：这题掌握了" : "✗ 已记录：加入错题本";
  fb.querySelector(".fb-note").textContent = removed
    ? "✓ 该题已从错题本移除" : (ok ? "" : "✗ 可在「错题重练」中再做一遍");
  $("self-judge").classList.add("hidden");
  showNextButton();
}

function renderFinish() {
  $("quiz-body").classList.add("hidden");
  const panel = $("finish-panel");
  panel.classList.remove("hidden");
  $("quiz-progress").textContent = "本轮完成";
  $("round-stats").textContent = "";

  const rest = poolOf(session.stageKey, session.unitKey, "wrong")
                 .filter(function (q) { return !!state.wrong[q.id]; }).length;
  const rate = session.roundAnswered ? Math.round(session.roundCorrect / session.roundAnswered * 100) : 0;
  panel.innerHTML =
    '<div class="finish-title">本轮完成</div>' +
    '<div class="finish-line">共作答 <b>' + session.roundAnswered + '</b> 题，答对 <b>' +
      session.roundCorrect + '</b> 题，正确率 <b>' + rate + '%</b></div>' +
    '<div class="finish-line" style="color:var(--muted);font-size:13px">' +
      stageName(session.stageKey) + ' / ' + unitName(session.unitKey) +
      ' 范围内错题本剩余 ' + rest + ' 题</div>' +
    '<div style="height:14px"></div>' +
    '<button type="button" class="btn btn-primary btn-large" data-act="again">再来一轮</button>' +
    '<button type="button" class="btn btn-ghost" data-act="home">返回首页</button>';
}

/* 答题页交互 */
$("btn-start").addEventListener("click", startQuiz);
$("btn-back").addEventListener("click", function () { showView("home"); renderHome(); });
$("btn-submit").addEventListener("click", submitAnswer);
$("btn-next").addEventListener("click", function () { session.index++; renderQuestion(); });
$("judge-ok").addEventListener("click", function () { judgeSelf(true); });
$("judge-no").addEventListener("click", function () { judgeSelf(false); });
$("btn-fill-starter").addEventListener("click", function () {
  if (session && session.submitted) { toast("本题已提交，下一题再练"); return; }
  const q = BY_ID[session.queue[session.index]];
  $("code-editor").value = q.starter;
  toast("已填入起手代码");
});
$("btn-clear-code").addEventListener("click", function () { $("code-editor").value = ""; });
$("finish-panel").addEventListener("click", function (e) {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "again") startQuiz();
  else { showView("home"); renderHome(); }
});

/* =========================================================================
 * 六、数据管理（二次确认后再清）
 * ========================================================================= */
$("btn-clear-wrong").addEventListener("click", function () {
  if (!Object.keys(state.wrong).length) { toast("错题本已经是空的"); return; }
  if (!confirm("确定清空错题本？此操作不可撤销。")) return;
  state.wrong = {};
  saveState();
  renderHome();
  toast("错题本已清空");
});
$("btn-clear-all").addEventListener("click", function () {
  if (!confirm("确定重置全部数据？已刷题数、正确率、错题本都会被清除，且不可撤销。")) return;
  const keep = { lastStage: state.lastStage, lastUnit: state.lastUnit, lastMode: state.lastMode };
  state = Object.assign(freshState(), keep);
  saveState();
  renderHome();
  toast("全部数据已重置");
});

/* =========================================================================
 * 七、启动
 * ========================================================================= */
renderHome();
showView("home");
</script>
</body>
</html>
